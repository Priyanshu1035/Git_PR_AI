<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Git_PR AI</title>
<style>
  :root { --bg:#fff; --fg:#1a1a1a; --muted:#666; --card:#f5f5f4; --border:#ddd; --accent:#2f6fed; }
  @media (prefers-color-scheme: dark) { :root { --bg:#161616; --fg:#eee; --muted:#999; --card:#222; --border:#333; --accent:#6f9cff; } }
  body { font:15px/1.5 system-ui,sans-serif; background:var(--bg); color:var(--fg); max-width:820px; margin:2rem auto; padding:0 1rem; }
  form { display:flex; gap:.5rem; flex-wrap:wrap; margin-bottom:1.5rem; }
  input, button { font:inherit; padding:.5rem .7rem; border:1px solid var(--border); border-radius:6px; background:var(--card); color:var(--fg); }
  button { background:var(--accent); color:#fff; border:0; cursor:pointer; }
  .job { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:.8rem 1rem; margin-bottom:.7rem; }
  .meta { color:var(--muted); font-size:13px; }
  .badge { font-size:12px; padding:2px 8px; border-radius:99px; border:1px solid var(--border); }
  pre { white-space:pre-wrap; font-size:12px; max-height:260px; overflow:auto; }
  a { color:var(--accent); }
</style>
</head>
<body>
<h1>Git_PR AI</h1>
<form id="f">
  <input id="key" type="password" placeholder="API key" required>
  <input id="repo" placeholder="owner/name" required>
  <input id="issue" type="number" min="1" placeholder="Issue #" required style="width:100px">
  <button>Fix issue</button>
</form>
<div id="jobs"></div>
<script>
const $ = (id) => document.getElementById(id);
$("key").value = sessionStorage.getItem("key") || "";
const headers = () => ({ "x-api-key": $("key").value, "content-type": "application/json" });

$("f").onsubmit = async (e) => {
  e.preventDefault();
  sessionStorage.setItem("key", $("key").value);
  const res = await fetch("/api/fix", { method: "POST", headers: headers(),
    body: JSON.stringify({ repo: $("repo").value, issueNumber: Number($("issue").value) }) });
  if (!res.ok) alert((await res.json()).error || "Request failed");
  refresh();
};

async function refresh() {
  if (!$("key").value) return;
  const res = await fetch("/api/jobs", { headers: headers() });
  if (!res.ok) return;
  const jobs = await res.json();
  const box = $("jobs");
  box.textContent = "";
  for (const j of jobs) {
    const el = document.createElement("div");
    el.className = "job";
    const title = document.createElement("div");
    title.textContent = `${j.repo} #${j.issueNumber} `;
    const badge = document.createElement("span");
    badge.className = "badge";
    badge.textContent = j.result?.status ? `${j.status}: ${j.result.status}` : j.status;
    title.append(badge);
    el.append(title);
    const meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent = j.error || j.result?.summary?.slice(0, 200) || new Date(j.createdAt).toLocaleString();
    el.append(meta);
    if (j.result?.prUrl) {
      const a = document.createElement("a");
      a.href = j.result.prUrl; a.target = "_blank"; a.rel = "noopener"; a.textContent = "View draft PR";
      el.append(a);
    }
    const d = document.createElement("details");
    const s = document.createElement("summary");
    s.textContent = "Logs";
    d.append(s);
    d.addEventListener("toggle", async () => {
      if (!d.open) return;
      const r = await fetch(`/api/jobs/${j.id}`, { headers: headers() });
      const pre = document.createElement("pre");
      pre.textContent = (await r.json()).logs.join("\n");
      d.querySelector("pre")?.remove();
      d.append(pre);
    });
    el.append(d);
    box.append(el);
  }
}
setInterval(() => { if (!document.querySelector("details[open]")) refresh(); }, 3000);
refresh();
</script>
</body>
</html>
